<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İyi ki doğdun 🎉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05010f; }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 60% 45% at 20% 25%, rgba(140, 50, 220, .55), transparent 70%),
      radial-gradient(ellipse 55% 50% at 80% 70%, rgba(70, 40, 190, .5), transparent 70%),
      radial-gradient(ellipse 45% 35% at 65% 15%, rgba(220, 60, 160, .3), transparent 70%),
      radial-gradient(ellipse 50% 40% at 30% 85%, rgba(90, 30, 150, .45), transparent 70%),
      linear-gradient(#070216, #12042b 55%, #0a0220);
  }
  canvas { position: fixed; inset: 0; pointer-events: none; }
  #yildiz { z-index: 0; }
  #parilti { z-index: 8; }

  /* ---------- ZARF ---------- */
  .zarf {
    position: relative; width: 260px; height: 170px; cursor: pointer; z-index: 5;
    background: #e9dcc3; border-radius: 6px;
    box-shadow: 0 0 50px rgba(200, 150, 255, .45);
    transition: transform .6s ease, opacity .6s ease;
  }
  .zarf::before {
    content: ""; position: absolute; inset: 0; border-radius: 6px;
    background:
      linear-gradient(to top right, transparent 49.5%, #d3c29f 50%) left / 50% 100% no-repeat,
      linear-gradient(to top left, transparent 49.5%, #d3c29f 50%) right / 50% 100% no-repeat;
  }
  .kapak { position: absolute; inset: 0; background: #cdb98f; clip-path: polygon(0 0, 100% 0, 50% 58%);
    transform-origin: top; transition: transform .6s ease; z-index: 2; }
  .muhur { position: absolute; top: 46%; left: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px;
    background: #7a1230; border-radius: 50%; z-index: 3; display: grid; place-items: center; color: #f5d9a8; font-size: 16px; transition: opacity .3s; }
  .ipucu { position: absolute; top: 112%; width: 100%; text-align: center; color: #cbb8ee; font: 14px system-ui, sans-serif; }
  @keyframes nabiz { 50% { transform: scale(1.04); } }
  body.acik .zarf { animation: none; transform: translateY(150px) scale(.55); opacity: 0; pointer-events: none; }
  body.acik .kapak { transform: rotateX(180deg); }
  body.acik .muhur, body.acik .ipucu { opacity: 0; }

  /* ---------- NEON YAZI ---------- */
  .mesaj {
    position: absolute; z-index: 10; text-align: center; max-width: 92vw; margin-top: -17vh; padding: 0 12px; box-sizing: border-box;
    font-family: "Pacifico", "Brush Script MT", cursive; line-height: 1.3; pointer-events: none;
    opacity: 0; transform: scale(.6); transition: opacity 1s ease .4s, transform 1s cubic-bezier(.2,1.4,.4,1) .4s;
  }
.mesaj .satir {
  display: block;
  font-size: clamp(2.5rem, 8vw, 5.5rem);
  color: #fff1fa;
  text-shadow:
    0 2px 8px rgba(255, 100, 200, .3),
    0 0 20px rgba(255, 80, 190, .35);
}

.mesaj .satir.diva {
  color: #f5eaff;
  text-shadow:
    0 2px 8px rgba(150, 120, 255, .3),
    0 0 20px rgba(150, 120, 255, .3);
}
  body.acik .mesaj { opacity: 1; transform: scale(1); }
  body.acik .mesaj .satir { animation: neon 7s infinite 2s; }
  @keyframes neon {
    0%, 100% { opacity: 1; }
    50%, { opacity: .55; }
  }

  /* ---------- BİTKİLER ---------- */
  .grup { position: absolute; bottom: 0; height: 52vh; width: 380px; z-index: 4; pointer-events: none; }
  .grup.sol { left: 0; } .grup.sag { right: 0; }

  .bitki { position: absolute; bottom: 0; width: 110px; height: var(--boy); margin-left: -55px; left: var(--x); }
  .govde { position: absolute; inset: 0; transform-origin: 50% 100%; transform: scaleY(0);
    transition: transform 1.8s cubic-bezier(.25,.8,.3,1) var(--d); }
  .govde svg { width: 100%; height: 100%; overflow: visible; }
  .bas { position: absolute; top: -70px; left: 50%; width: 140px; height: 140px; margin-left: -70px; transform: scale(0) rotate(-40deg);
    transition: transform 1.2s cubic-bezier(.2,1.5,.4,1) calc(var(--d) + 1.5s); filter: drop-shadow(0 2px 5px rgba(30, 15, 40, .25));; }
  .bas svg { width: 100%; height: 100%; overflow: visible; will-change: transform; animation: salin 5s ease-in-out infinite alternate; transform-origin: 50% 60%; }
  .sap { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: 1;
    clip-path: inset(100% -20% 0 -20%); transition: clip-path 1.8s cubic-bezier(.25,.8,.3,1) var(--d); }
  body.acik .sap { clip-path: inset(-20% -20% 0 -20%); }
  .kafa { position: absolute; width: 0; height: 0; z-index: 3; }
  .yap { position: absolute; width: 0; height: 0; z-index: 1; }
  .yap .yi { position: absolute; bottom: 0; width: 52px; height: 35px; scale: 0; transition: scale .7s cubic-bezier(.2,1.4,.4,1) var(--ld); }
  .yap.sl .yi { right: 0; transform-origin: 100% 100%; }
  .yap.sg .yi { left: 0; transform-origin: 0 100%; }
  .yap.sg .yi svg { transform: scaleX(-1); }
  .yap .yi svg { width: 100%; height: 100%; overflow: visible; }
  body.acik .yap .yi { scale: 1; }
  @keyframes salin { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  body.acik .govde { transform: scaleY(1); }
  body.acik .bas { transform: scale(1) rotate(0); }

  .cim { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }
  .cim svg { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; overflow: visible; }
  .cim path { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0);
    transition: transform 1.3s cubic-bezier(.3,1.3,.5,1); animation: ruzgar 3.5s ease-in-out infinite alternate; }
  body.acik .cim path { transform: scaleY(1); }
  @keyframes ruzgar { from { rotate: -3deg; } to { rotate: 3deg; } }

  /* ---------- SÜSLÜ HAMAM BÖCEĞİ ---------- */
  .bocek { position: fixed; bottom: 2vh; left: 50%; width: 110px; margin-left: -55px; z-index: 6; opacity: 0; pointer-events: none; transform: translateX(-75vw); }
  .bocek.gel { opacity: 1; pointer-events: auto; cursor: pointer; animation: bocekyuru 6s cubic-bezier(.3,.6,.4,1) forwards; }
  @keyframes bocekyuru { from { transform: translateX(-75vw); } to { transform: translateX(0); } }
  .bocek .gov { transform-origin: 50% 100%; filter: drop-shadow(0 0 10px rgba(255, 170, 90, .55)); }
  .bocek .gov svg { width: 100%; display: block; overflow: visible; }
  .bocek.gel .gov { animation: bob .3s ease-in-out infinite alternate; }
  .bocek.dans .gov { animation: dans .9s ease-in-out infinite; }
  @keyframes bob { to { transform: translateY(-4px); } }
  @keyframes dans {
    0%, 100% { transform: rotate(-7deg) translateY(0); }
    25% { transform: rotate(7deg) translateY(-9px); }
    50% { transform: rotate(-7deg) translateY(0); }
    75% { transform: rotate(7deg) translateY(-9px); }
  }
  .bacak path { stroke: #4a2a12; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .bocek.gel .bacak { animation: bacak .3s ease-in-out infinite alternate; }
  .bocek.dans .bacak { animation-duration: .5s; }
  .bocek.gel .bacak.b { animation-direction: alternate-reverse; }
  @keyframes bacak { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
  .kol path { stroke: #4a2a12; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .bocek.gel .kol { animation: kol .3s ease-in-out infinite alternate; }
  .bocek.dans .kol { animation-duration: .45s; }
  .bocek.gel .kol.b { animation-direction: alternate-reverse; }
  @keyframes kol { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
  .ant { animation: ant 1.3s ease-in-out infinite alternate; }
  .ant.b { animation-direction: alternate-reverse; }
  @keyframes ant { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  .gl { fill: #fff; animation: blink 1.1s ease-in-out infinite alternate; }
  @keyframes blink { from { opacity: .15; } to { opacity: 1; } }
  .pup { animation: jig .45s ease-in-out infinite alternate; }
  @keyframes jig { from { transform: translate(-1.2px, 1px); } to { transform: translate(1.2px, -1px); } }
  .balon { position: absolute; bottom: 100%; left: 50%; margin-bottom: 6px; padding: 8px 13px; border-radius: 14px; white-space: nowrap;
    background: #fff; color: #8a1fb0; font: 700 14px system-ui, sans-serif; box-shadow: 0 0 18px rgba(255, 120, 230, .8);
    opacity: 0; transform: translateX(-50%) scale(.5); transform-origin: 50% 100%; pointer-events: none; }
  .balon::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -7px; border: 7px solid transparent; border-top-color: #fff; }
  .balon.sy { animation: pop .45s cubic-bezier(.2,1.5,.4,1) forwards; }
  @keyframes pop { to { opacity: 1; transform: translateX(-50%) scale(1); } }
  @media (max-width: 600px) { .bocek { width: 84px; margin-left: -42px; } .balon { font-size: 12.5px; } }

  @media (max-width: 600px) {
    .grup { width: 195px; height: 40vh; }
    .bitki { width: 60px; margin-left: -30px; }
    .bas { width: 80px; height: 80px; margin-left: -40px; top: -40px; }
    .yap .yi { width: 34px; height: 23px; }
  }
  @media (prefers-reduced-motion: reduce) { .zarf, .bas svg, .cim path, .mesaj .satir { animation: none !important; } }
</style>
</head>
<body>

<canvas id="yildiz"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="golge" x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.8"/><feOffset dy="1.6"/><feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="organik" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter>
  <filter id="yumusak"><feGaussianBlur stdDeviation="1.4"/></filter>
</defs></svg>
<canvas id="parilti"></canvas>

<div class="grup sol" id="sol"></div>
<div class="grup sag" id="sag"></div>

<div class="mesaj">
  <span class="satir">İyi ki doğdun</span>
  <span class="satir diva">gerçek diva</span>
</div>

<div class="bocek" id="bocek"><div class="balon" id="balon"></div><div class="gov"></div></div>

<div class="zarf" id="zarf" role="button" tabindex="0" aria-label="Zarfı aç">
  <div class="kapak"></div><div class="muhur">♥</div><div class="ipucu">Zarfa tıkla</div>
</div>

<script>
  /* ====== RENK PALETİ (istersen buradan değiştir) ====== */
  const RENK = {
    lacivert: { acik: "#5a78e8", orta: "#24379c", koyu: "#0b1450", isik: "rgba(70,100,255,.55)" },
    bordo:    { acik: "#e0476d", orta: "#8e1634", koyu: "#4a0618", isik: "rgba(220,50,90,.5)" },
    mor:      { acik: "#c58cff", orta: "#7b3fc4", koyu: "#3d1470", isik: "rgba(180,110,255,.55)" }
  };
  const r = (a, b) => a + Math.random() * (b - a);
  let uid = 0;

  /* ====== ORTAK GRADYANLAR ====== */
  function tanim(id, c) {
    return `<defs>
      <linearGradient id="${id}t" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${c.koyu}"/><stop offset=".5" stop-color="${c.orta}"/><stop offset="1" stop-color="${c.acik}"/></linearGradient>
      <radialGradient id="${id}p" cx="50%" cy="105%" r="115%"><stop offset="0" stop-color="${c.koyu}"/><stop offset=".5" stop-color="${c.orta}"/><stop offset="1" stop-color="${c.acik}"/></radialGradient>
      <radialGradient id="${id}l" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <radialGradient id="${id}h" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="${c.acik}" stop-opacity=".3"/><stop offset="1" stop-color="${c.acik}" stop-opacity="0"/></radialGradient>
      <radialGradient id="${id}m" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#000" stop-opacity=".8"/><stop offset="1" stop-color="${c.koyu}" stop-opacity="0"/></radialGradient>
      <radialGradient id="${id}g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e9f08a" stop-opacity=".85"/><stop offset="1" stop-color="#e9f08a" stop-opacity="0"/></radialGradient>
    </defs>`;
  }
  const dew = (n, R, cy = 0) => Array.from({ length: n }, () => {
    const a = r(0, 6.28), d = r(8, R), x = (Math.cos(a) * d).toFixed(1), y = (Math.sin(a) * d + cy).toFixed(1);
    return `<circle cx="${x}" cy="${y}" r="${r(1, 1.8).toFixed(1)}" fill="#fff" fill-opacity=".35" stroke="#fff" stroke-opacity=".55" stroke-width=".4"/><circle cx="${x - .4}" cy="${y - .5}" r=".55" fill="#fff"/>`;
  }).join("");

  /* ====== LALE (lacivert) ====== */
  function lale(c, id) {
    const k = `stroke="${c.koyu}" stroke-opacity=".6" stroke-width="1"`;
    const kenar = `stroke="${c.acik}" stroke-opacity=".6" stroke-width="1.6" fill="none"`;
    const damar = ["M-6,8 C-12,-14 -8,-38 -2,-58", "M0,10 C0,-20 0,-42 0,-60", "M6,8 C12,-14 8,-38 2,-58", "M-13,4 C-20,-14 -14,-36 -9,-52", "M13,4 C20,-14 14,-36 9,-52"]
      .map(d => `<path d="${d}" stroke="${c.koyu}" stroke-opacity=".25" stroke-width=".8" fill="none"/>`).join("");
    return `<svg viewBox="-60 -60 120 120">${tanim(id, c)}
      <ellipse cx="0" cy="-26" rx="54" ry="50" fill="url(#${id}h)"/>
      <g filter="url(#golge)">
        <path d="M0,10 C-44,0 -46,-32 -28,-56 C-14,-42 -6,-22 0,10Z" fill="${c.koyu}" ${k}/>
        <path d="M0,10 C44,0 46,-32 28,-56 C14,-42 6,-22 0,10Z" fill="${c.koyu}" ${k}/>
      </g>
      <g filter="url(#golge)">
        <path d="M-1,11 C-32,4 -36,-26 -22,-53 C-10,-41 -4,-24 -1,11Z" fill="url(#${id}t)" ${k}/>
        <path d="M1,11 C32,4 36,-26 22,-53 C10,-41 4,-24 1,11Z" fill="url(#${id}t)" ${k}/>
      </g>
      <g filter="url(#golge)">
        <path d="M0,13 C-26,7 -30,-22 -15,-48 C-9,-58 -3,-60 0,-65 C3,-60 9,-58 15,-48 C30,-22 26,7 0,13Z" fill="url(#${id}t)" ${k}/>
        <path d="M-15,-48 C-9,-58 -3,-60 0,-65 C3,-60 9,-58 15,-48" ${kenar}/>
        ${damar}
        <ellipse cx="-10" cy="-28" rx="7" ry="20" fill="url(#${id}l)"/>
      </g>
      <ellipse cx="0" cy="12" rx="9" ry="4" fill="#14522f"/>
      ${dew(4, 22, -28)}
    </svg>`;
  }

  /* ====== GÜL (bordo) ====== */
  function gul(c, id) {
    const P = "M-21,0 C-38,-20 -26,-48 0,-48 C26,-48 38,-20 21,0 C10,5 -10,5 -21,0Z";
    const lip = "M-31,-26 C-27,-42 -10,-49 0,-49 C10,-49 27,-42 31,-26";
    const dm = "M0,-4 C0,-20 0,-32 0,-42 M-8,-6 C-10,-20 -12,-30 -14,-38 M8,-6 C10,-20 12,-30 14,-38";
    let s = "";
    const halka = (n, sc, of, rot) => {
      let g = "";
      for (let i = 0; i < n; i++) {
        const a = (360 / n) * i + rot + r(-6, 6), q = sc * r(.92, 1.08);
        g += `<g transform="rotate(${a}) translate(0,${-of}) scale(${q})">
          <path d="${P}" fill="url(#${id}p)" stroke="${c.koyu}" stroke-opacity=".6" stroke-width="${1 / q}"/>
          <ellipse cx="-8" cy="-30" rx="9" ry="15" fill="url(#${id}l)"/>
          <path d="${lip}" stroke="${c.acik}" stroke-opacity=".8" stroke-width="${2.4 / q}" fill="none" stroke-linecap="round"/>
          <path d="${dm}" stroke="${c.koyu}" stroke-opacity=".28" stroke-width="${.8 / q}" fill="none"/></g>`;
      }
      s += `<g filter="url(#golge)"><g filter="url(#organik)">${g}</g></g>`;
    };
    halka(8, .9, 12, 0); halka(7, .72, 9, 20); halka(6, .55, 6, 8); halka(5, .4, 4, 30); halka(4, .27, 2, 12);
    return `<svg viewBox="-60 -60 120 120">${tanim(id, c)}<circle r="58" fill="url(#${id}h)"/>${s}
      <g filter="url(#golge)"><ellipse rx="7" ry="6.5" fill="url(#${id}p)" stroke="${c.koyu}" stroke-opacity=".7"/>
        <path d="M-5,1 C-6,-6 5,-8 6,-1 C6,5 -2,6 -2,1" stroke="${c.acik}" stroke-opacity=".8" stroke-width="1.1" fill="none"/>
        <path d="M-2,-1 C-2,-4 2,-4 2,-1" stroke="${c.koyu}" stroke-width="1" fill="none"/></g>
      ${dew(5, 36)}</svg>`;
  }

  /* ====== ZAMBAK (mor) ====== */
  function zambak(c, id) {
    const P = "M0,0 C-17,-8 -25,-34 -6,-50 C-3,-56 0,-62 0,-65 C0,-62 3,-56 6,-50 C25,-34 17,-8 0,0Z";
    let s = "";
    const petaller = (rot, sc) => {
      let g = "";
      for (let i = 0; i < 3; i++) {
        let benek = "";
        for (let k = 0; k < 9; k++) benek += `<circle cx="${r(-8, 8).toFixed(1)}" cy="${-r(8, 36).toFixed(1)}" r="${r(.7, 1.6).toFixed(1)}" fill="${c.koyu}" fill-opacity=".75"/>`;
        g += `<g transform="rotate(${120 * i + rot + r(-3, 3)}) scale(${sc})">
          <path d="${P}" fill="url(#${id}p)" stroke="${c.koyu}" stroke-opacity=".6"/>
          <path d="M0,-4 L0,-54" stroke="${c.koyu}" stroke-opacity=".5" stroke-width="2.6" filter="url(#yumusak)"/>
          <path d="M-6,-50 C-3,-56 0,-62 0,-65 C0,-62 3,-56 6,-50 C3,-53 -3,-53 -6,-50Z" fill="#fff" fill-opacity=".28"/>
          <path d="${P}" stroke="${c.acik}" stroke-opacity=".6" stroke-width="1.2" fill="none"/>${benek}</g>`;
      }
      s += `<g filter="url(#golge)"><g filter="url(#organik)">${g}</g></g>`;
    };
    petaller(0, 1); petaller(60, .93);
    let st = "";
    for (let i = 0; i < 6; i++) {
      const a = i * 60 + 12 + r(-8, 8), L = r(24, 32), rad = a * Math.PI / 180;
      const ex = Math.sin(rad) * L, ey = -Math.cos(rad) * L, cx = Math.sin(rad) * L * .4 + r(-3, 3), cy = -Math.cos(rad) * L * .6;
      st += `<path d="M0,0 Q${cx.toFixed(1)},${cy.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}" stroke="#efe6b8" stroke-width="1.3" fill="none"/>
        <ellipse transform="translate(${ex.toFixed(1)},${ey.toFixed(1)}) rotate(${(a + r(-25, 25)).toFixed(0)})" rx="1.9" ry="5.6" fill="#b4521a"/>
        <ellipse transform="translate(${ex.toFixed(1)},${ey.toFixed(1)}) rotate(${a.toFixed(0)})" rx="1" ry="4" fill="#f0a020" fill-opacity=".8"/>`;
    }
    return `<svg viewBox="-60 -60 120 120">${tanim(id, c)}<circle r="58" fill="url(#${id}h)"/>${s}
      <circle r="13" fill="url(#${id}m)"/><circle r="11" fill="url(#${id}g)"/>${st}
      <path d="M0,0 L2,-30" stroke="#dfe98a" stroke-width="1.6"/><circle cx="2" cy="-31" r="2.4" fill="#cfe070"/>${dew(4, 34)}</svg>`;
  }

  function cicekBasi(c, ad) {
    const id = "f" + (uid++);
    return ad === "lacivert" ? lale(c, id) : ad === "bordo" ? gul(c, id) : zambak(c, id);
  }

  /* ====== SAP + YAPRAKLAR ====== */
  function yaprak(x, y, sag, gec) {
    const id = "y" + (uid++);
    return `<div class="yap ${sag ? "sg" : "sl"}" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;--ld:${gec.toFixed(2)}s"><div class="yi"><svg viewBox="0 0 60 40">
      <defs><linearGradient id="${id}" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0d4a28"/><stop offset="1" stop-color="#46b874"/></linearGradient></defs>
      <path d="M60,40 C42,40 14,34 2,4 C24,6 50,18 60,40Z" fill="url(#${id})" stroke="#0a3a20" stroke-width="1"/>
      <path d="M60,40 C38,30 20,18 4,5" stroke="#b6f0c8" stroke-opacity=".55" fill="none"/>
      <path d="M46,34 L38,22 M36,28 L28,15 M26,21 L19,10 M50,32 L50,38 M38,27 L42,36 M27,20 L32,29" stroke="#b6f0c8" stroke-opacity=".28" stroke-width=".7" fill="none"/></svg></div></div>`;
  }
  /* ====== ÇİMEN ====== */
  function cimen(adet) {
    let p = "";
    for (let i = 0; i < adet; i++) {
      const x = r(0, 380), h = r(18, 62), w = r(3, 6), b = r(-14, 14);
      const ton = ["#0f4d2b", "#18703c", "#2a9456", "#0c3a22"][Math.floor(Math.random() * 4)];
      p += `<path d="M${x - w},100 Q${x},${100 - h * .6} ${x + b},${100 - h} Q${x + w * .4},${100 - h * .55} ${x + w},100Z" fill="${ton}" style="transition-delay:${r(.2, 1.4).toFixed(2)}s;animation-delay:${r(0, 2).toFixed(2)}s"/>`;
    }
    return `<svg viewBox="0 0 380 100" preserveAspectRatio="none">${p}</svg>`;
  }

  /* ====== BİTKİLERİ KUR (üç çiçek aynı kökten) ====== */
  function kur(kap, sira, yon) {
    const kokX = 38;
    const uclar = [[14, 26], [46, 10], [80, 40]];            // sap uçları (x%, y%)
    kap.insertAdjacentHTML("beforeend", `<div class="cim" style="height:22%">${cimen(60)}</div>`);
    sira.forEach((ad, i) => {
      const c = RENK[ad], d = i * .2;
      let [ex, ey] = uclar[i], rx = kokX;
      if (yon < 0) { ex = 100 - ex; rx = 100 - kokX; }
      const c1 = [rx + (ex - rx) * .08 + r(-5, 5), 100 - (100 - ey) * .5];
      const c2 = [ex + r(-4, 4), ey + (100 - ey) * .42];
      const nokta = t => { const u = 1 - t; return [0, 1].map(k => u*u*u*[rx,100][k] + 3*u*u*t*c1[k] + 3*u*t*t*c2[k] + t*t*t*[ex,ey][k]); };
      const gid = "k" + (uid++);
      const yol = `M${rx},100 C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${ex},${ey}`;
      kap.insertAdjacentHTML("beforeend", `<svg class="sap" viewBox="0 0 100 100" preserveAspectRatio="none" style="--d:${d}s">
        <defs><linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="${ey}"><stop offset="0" stop-color="#0d3a22"/><stop offset="1" stop-color="#3fae6c"/></linearGradient></defs>
        <path d="M${rx},101 L${rx},88" stroke="#0d3a22" stroke-width="8" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke"/>
        <path d="${yol}" stroke="url(#${gid})" stroke-width="3.6" fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`);
      [.3, .5, .72].forEach((t, k) => {
        const [x, y] = nokta(t);
        kap.insertAdjacentHTML("beforeend", yaprak(x, y, (i + k) % 2, d + .3 + (100 - y) / 100 * 1.5));
      });
      kap.insertAdjacentHTML("beforeend", `<div class="kafa" style="left:${ex}%;top:${ey}%;--d:${d}s;--isik:${c.isik}"><div class="bas">${cicekBasi(c, ad)}</div></div>`);
    });
    kap.insertAdjacentHTML("beforeend", `<div class="cim" style="height:14%;z-index:2">${cimen(45)}</div>`);
  }
  kur(document.getElementById("sol"), ["lacivert", "bordo", "mor"], 1);
  kur(document.getElementById("sag"), ["mor", "lacivert", "bordo"], -1);

  /* ====== GALAKSİ YILDIZLARI ====== */
  const yc = document.getElementById("yildiz"), yx = yc.getContext("2d");
  const pc = document.getElementById("parilti"), px = pc.getContext("2d");
  let W, H, yildizlar = [], kayan = [], parcalar = [];
  function boyutla() {
    W = yc.width = pc.width = innerWidth; H = yc.height = pc.height = innerHeight;
    yildizlar = Array.from({ length: Math.round(W * H / 3500) }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() ** 3 * 1.8 + .3,
      f: Math.random() * 6, h: Math.random() * .04 + .01,
      c: ["#ffffff", "#e3d4ff", "#ffd9f2", "#c8e6ff"][Math.floor(Math.random() * 4)]
    }));
  }
  addEventListener("resize", boyutla); boyutla();

  function yildizCiz(ctx, x, y, s) {
    ctx.beginPath(); ctx.moveTo(x, y - s * 2.4); ctx.lineTo(x + s * .5, y - s * .5); ctx.lineTo(x + s * 2.4, y);
    ctx.lineTo(x + s * .5, y + s * .5); ctx.lineTo(x, y + s * 2.4); ctx.lineTo(x - s * .5, y + s * .5);
    ctx.lineTo(x - s * 2.4, y); ctx.lineTo(x - s * .5, y - s * .5); ctx.closePath(); ctx.fill();
  }
  const tonlar = ["#fff3c4", "#ffd978", "#ffffff", "#d9b8ff", "#ffb3c7"];
  function parcaEkle(x, y, vx, vy) {
    parcalar.push({ x, y, vx: vx ?? r(-.6, .6), vy: vy ?? r(-.8, .4), r: r(1, 3.4), t: 0, max: r(70, 160), c: tonlar[Math.floor(Math.random() * 5)], f: r(0, 6) });
  }

  function dongu(t) {
    yx.clearRect(0, 0, W, H);
    for (const s of yildizlar) {
      yx.globalAlpha = .35 + .65 * Math.abs(Math.sin(t * s.h * .1 + s.f));
      yx.fillStyle = s.c; yx.beginPath(); yx.arc(s.x, s.y, s.r, 0, 6.283); yx.fill();
    }
    if (Math.random() < .008) kayan.push({ x: r(0, W), y: r(0, H * .4), vx: r(7, 11), vy: r(3, 5), o: 1 });
    for (const k of kayan) {
      k.x += k.vx; k.y += k.vy; k.o -= .018;
      const g = yx.createLinearGradient(k.x, k.y, k.x - k.vx * 9, k.y - k.vy * 9);
      g.addColorStop(0, `rgba(255,255,255,${Math.max(k.o, 0)})`); g.addColorStop(1, "rgba(255,255,255,0)");
      yx.globalAlpha = 1; yx.strokeStyle = g; yx.lineWidth = 2; yx.beginPath();
      yx.moveTo(k.x, k.y); yx.lineTo(k.x - k.vx * 9, k.y - k.vy * 9); yx.stroke();
    }
    kayan = kayan.filter(k => k.o > 0);

    px.clearRect(0, 0, W, H);
    for (const p of parcalar) {
      p.x += p.vx; p.y += p.vy; p.vx *= .985; p.vy *= .985; p.t++;
      px.fillStyle = p.c; px.shadowColor = p.c; px.shadowBlur = 12;
      px.globalAlpha = Math.max(Math.sin(p.t / p.max * Math.PI) * (.6 + .4 * Math.sin(p.t * .3 + p.f)), 0);
      yildizCiz(px, p.x, p.y, p.r);
    }
    parcalar = parcalar.filter(p => p.t < p.max);
    requestAnimationFrame(dongu);
  }
  requestAnimationFrame(dongu);

  /* ====== SÜSLÜ HAMAM BÖCEĞİ ====== */
  function bocekSVG() {
    // iki ayak: topuklu ayakkabılı
    let bacak = "";
    [[42, 1], [58, 0]].forEach(([x, b]) => {
      bacak += `<g class="bacak ${b ? "b" : ""}" style="transform-origin:${x}px 130px"><path d="M${x},130 L${x - 3},148 L${x + 1},164"/>
        <polygon points="${x - 5},162 ${x + 8},164 ${x + 11},169 ${x - 5},169" fill="#e0102a" stroke="#7a0016" stroke-width="1"/>
        <polygon points="${x - 5},169 ${x - 2},169 ${x - 2},174 ${x - 5},174" fill="#7a0016"/></g>`;
    });
    // gövde parıltıları
    let glit = "";
    for (let i = 0; i < 12; i++) {
      let x, y;
      do { x = r(28, 72); y = r(70, 134); } while (((x - 50) / 26) ** 2 + ((y - 102) / 36) ** 2 > .8);
      glit += `<circle class="gl" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r(.7, 1.5).toFixed(1)}" style="animation-delay:${r(0, 2).toFixed(2)}s"/>`;
    }
    // inci kolye
    let inci = "";
    for (let i = 0; i <= 6; i++) { const t = i / 6; inci += `<circle cx="${(30 + 40 * t).toFixed(1)}" cy="${(66 + 28 * t * (1 - t)).toFixed(1)}" r="2.4" fill="#fff" stroke="#d7d0c8" stroke-width=".6"/>`; }
    // kirpikler
    const kirpik = (cx, cy) => {
      let d = "";
      for (let i = 0; i < 6; i++) { const a = (-165 + i * 30) * Math.PI / 180; d += `M${(cx + Math.cos(a) * 6.5).toFixed(1)},${(cy + Math.sin(a) * 6.5).toFixed(1)} L${(cx + Math.cos(a) * 12.5).toFixed(1)},${(cy + Math.sin(a) * 12.5).toFixed(1)} `; }
      return `<path d="${d}" stroke="#111" stroke-width="1.7" stroke-linecap="round" fill="none"/>`;
    };
    return `<svg viewBox="0 0 100 175">
      <defs>
        <linearGradient id="tg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d1925a"/><stop offset=".5" stop-color="#8f5322"/><stop offset="1" stop-color="#4a2610"/></linearGradient>
        <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#d9961a"/></linearGradient>
      </defs>
      <g class="ant" style="transform-origin:38px 24px"><path d="M38,24 C28,12 26,6 16,0" stroke="#5a3318" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>
      <g class="ant b" style="transform-origin:62px 24px"><path d="M62,24 C72,12 76,6 86,0" stroke="#5a3318" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>
      <g class="kol b" style="transform-origin:28px 78px"><path d="M28,78 L20,98 L24,116"/><circle cx="24" cy="117" r="3.6" fill="#8f5322" stroke="#2a1406" stroke-width="1"/></g>
      ${bacak}
      <ellipse cx="50" cy="102" rx="26" ry="36" fill="url(#tg1)" stroke="#2a1406" stroke-width="1.5"/>
      <path d="M50,72 L50,136" stroke="#2a1406" stroke-width=".8" opacity=".6"/>
      <ellipse cx="41" cy="92" rx="6" ry="22" fill="#fff" opacity=".22"/>
      ${glit}
      <ellipse cx="50" cy="68" rx="25" ry="13" fill="#b5702e" stroke="#2a1406" stroke-width="1.5"/>
      <ellipse cx="50" cy="68" rx="12" ry="6" fill="#5a3012" opacity=".6"/>
      ${inci}
      <ellipse cx="50" cy="40" rx="21" ry="23" fill="url(#tg1)" stroke="#2a1406" stroke-width="1.5"/>
      <ellipse cx="42" cy="26" rx="9" ry="4" fill="#fff" opacity=".22"/>
      <ellipse cx="43" cy="30" rx="11" ry="6.5" fill="#ff4fb0" opacity=".9"/><ellipse cx="43" cy="31" rx="8" ry="4.5" fill="#2f6bff"/>
      <ellipse cx="60" cy="30" rx="11" ry="6.5" fill="#ff4fb0" opacity=".9"/><ellipse cx="60" cy="31" rx="8" ry="4.5" fill="#2f6bff"/>
      <circle cx="43" cy="37" r="7" fill="#fff" stroke="#111" stroke-width="1.1"/><circle class="pup" cx="45" cy="38" r="3.2" fill="#111"/>
      <circle cx="60" cy="37" r="7" fill="#fff" stroke="#111" stroke-width="1.1"/><circle class="pup" cx="62" cy="38" r="3.2" fill="#111"/>
      <path d="M36,37 L30,31 M67,37 L74,31" stroke="#111" stroke-width="1.8" stroke-linecap="round"/>
      ${kirpik(43, 37)}${kirpik(60, 37)}
      <path d="M33,23 Q43,15 52,22 M51,22 Q60,15 70,23" stroke="#2a1406" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <circle cx="33" cy="49" r="5.5" fill="#ff5a8a" opacity=".65"/><circle cx="69" cy="49" r="5.5" fill="#ff5a8a" opacity=".65"/>
      <path d="M35,53 C41,45 47,48 51,50 C55,48 61,45 67,53 C61,56 41,56 35,53Z" fill="#e0062a" stroke="#7a0016" stroke-width="1"/>
      <path d="M35,53 C41,63 61,63 67,53 C61,56 41,56 35,53Z" fill="#f01a3a" stroke="#7a0016" stroke-width="1"/>
      <ellipse cx="46" cy="58.5" rx="5" ry="1.6" fill="#fff" opacity=".55"/>
      <path d="M67,53 Q71,52 72,49" stroke="#e0062a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="62" cy="46.5" r=".9" fill="#2a1406"/>
      <g transform="rotate(-8 50 20)">
        <path d="M36,22 L38,8 L44,15 L50,5 L56,15 L62,8 L64,22Z" fill="url(#bg2)" stroke="#8a5a0a" stroke-width="1"/>
        <circle cx="50" cy="15" r="2" fill="#ff3fa8"/><circle cx="42" cy="17" r="1.3" fill="#3df0ff"/><circle cx="58" cy="17" r="1.3" fill="#3df0ff"/>
      </g>
      <g class="kol" style="transform-origin:72px 80px"><path d="M72,80 L82,98 L80,114"/><circle cx="80" cy="115" r="3.6" fill="#8f5322" stroke="#2a1406" stroke-width="1"/>
        <path d="M72,128 C72,114 88,114 88,128" style="stroke:#7a0a14;stroke-width:2.6;fill:none"/>
        <rect x="68" y="126" width="24" height="19" rx="3" fill="#e0102a" stroke="#7a0016" stroke-width="1.2"/>
        <polygon points="68,126 80,137 92,126" fill="#c00d24" stroke="#7a0016" stroke-width="1"/>
        <circle cx="80" cy="137" r="2.5" fill="#ffd86b" stroke="#8a5a0a" stroke-width=".6"/>
        <ellipse cx="73" cy="131" rx="2.4" ry="1.2" fill="#fff" opacity=".45"/>
      </g>
    </svg>`;
  }
  const bocek = document.getElementById("bocek"), balon = document.getElementById("balon");
  bocek.querySelector(".gov").innerHTML = bocekSVG();
  const sozler = ["Doğum günün kutlu olsun! 🎉", "Gerçek diva benim 💅", "lülülülüüüü 🥴", "Mutlu yıllar divaaa! 🥳", "Pasta nerede? 🎂"];
  let soz = 0;
  function sozGoster() {
    balon.textContent = sozler[soz++ % sozler.length];
    balon.classList.remove("sy"); void balon.offsetWidth; balon.classList.add("sy");
  }
  function bocekGel() { bocek.classList.add("gel"); }
  bocek.addEventListener("animationend", e => {
    if (e.animationName !== "bocekyuru") return;
    bocek.classList.add("dans"); sozGoster();
    setInterval(sozGoster, 3500);
    setInterval(() => { const q = bocek.getBoundingClientRect(); parcaEkle(q.left + r(0, q.width), q.top + r(0, q.height)); }, 90);
  });
  bocek.addEventListener("click", () => {
    if (!bocek.classList.contains("dans")) return;
    sozGoster();
    const q = bocek.getBoundingClientRect();
    for (let i = 0; i < 30; i++) { const a = r(0, 6.283), h = r(1, 4); parcaEkle(q.left + q.width / 2, q.top + q.height / 2, Math.cos(a) * h, Math.sin(a) * h); }
  });

  /* ====== ZARFA TIKLAMA ====== */
  const zarf = document.getElementById("zarf");
  function ac() {
    if (document.body.classList.contains("acik")) return;
    document.body.classList.add("acik");
    setTimeout(bocekGel, 2800);
    for (let i = 0; i < 110; i++) {
      const a = r(0, 6.283), h = r(1, 6);
      parcaEkle(W / 2, H / 2, Math.cos(a) * h, Math.sin(a) * h);
    }
    setInterval(() => { for (let i = 0; i < 3; i++) parcaEkle(r(0, W), r(0, H)); }, 120);
  }
  zarf.addEventListener("click", ac);
  zarf.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") ac(); });
</script>
</body>
</html>
